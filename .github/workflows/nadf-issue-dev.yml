# NADF-GUIDE
# Propósito: Issues DoEventsWEB → Complexity Routing → Cloud Agent → auto-merge → build/deploy DEV.
# Configuración: secrets CURSOR_API_KEY, GH_PAT; vars AWS_ROLE_ARN, CLOUDFRONT_DISTRIBUTION_ID,
#                VITE_GOOGLE_MAPS_API_KEY, NADF_AUTO_MERGE_DEV (default true), NADF_AUTO_DEPLOY_DEV (default true).
# Política: auto-merge/deploy solo a DEV. PROD forbidden.
name: NADF DoEvents issue → DEV

on:
  # Solo `labeled` (+ reopened): al crear un issue CON label `nadf`, GitHub dispara
  # opened Y labeled → dos runs. Con solo labeled queda una ejecución.
  issues:
    types: [labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número de issue a procesar"
        required: true
        type: string
      mode:
        description: "full = agente+merge+deploy | deploy-only = build+deploy DEV (sin agente)"
        type: choice
        options:
          - full
          - deploy-only
        default: full
      skip_deploy:
        description: "Omitir deploy DEV"
        type: boolean
        default: false
      skip_merge:
        description: "Omitir auto-merge de PRs del agente"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Incluir label/action en el group: al crear un issue con `nadf`+`bug`, GitHub
# dispara dos `labeled`. Si el group es solo el número, cancel-in-progress mata
# el run de `nadf` cuando llega el de `bug` (que luego queda skipped).
concurrency:
  group: nadf-doevents-issue-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event_name == 'issues' && github.event.label.name || github.event.action || inputs.mode || 'dispatch' }}
  cancel-in-progress: false

jobs:
  nadf:
    name: Intake → Route → Agent → DEV
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        ((github.event.action == 'reopened' && contains(join(github.event.issue.labels.*.name, ','), 'nadf')) ||
         (github.event.action == 'labeled' && (github.event.label.name == 'nadf' || github.event.label.name == 'nadf:approved'))))
    steps:
      - name: Resolve issue number
        id: issue
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout DoEventsWEB (NADF branch)
        uses: actions/checkout@v4
        with:
          ref: feature/NovusAIDevelopmentFramework
          path: web
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Checkout NADF framework
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        uses: actions/checkout@v4
        with:
          repository: arodriguez-novusintelligence/NovusAIDevelopmentFramework
          ref: feature/nadf-foundation
          path: nadf
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            nadf/prototypes/m6-cloud-agent/package-lock.json
            web/package-lock.json

      - name: Install NADF runtime
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        run: npm ci --prefix nadf/prototypes/m6-cloud-agent

      - name: Fetch issue payload
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          gh api "repos/arodriguez-novusintelligence/DoEventsWEB/issues/${{ steps.issue.outputs.number }}" \
            --jq '{number,title,body,html_url,labels:[.labels[].name]}' > issue.json
          cat issue.json

      - name: Complexity Routing
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        working-directory: nadf/prototypes/m6-cloud-agent
        env:
          NADF_ISSUE_JSON: ${{ github.workspace }}/issue.json
        run: |
          npm run route:doevents-issue
          cp route-decision.json "${{ github.workspace }}/route-decision.json"
          cat route-decision.json

      - name: Seed route for deploy-only
        if: ${{ steps.issue.outputs.mode == 'deploy-only' }}
        shell: bash
        run: |
          echo '{"target":"both","profile":"DEPLOY_ONLY","lightweight":true,"workBranch":"feature/NovusAIDevelopmentFramework","targetRepos":[]}' > route-decision.json
          cat route-decision.json

      - name: Comment routing on issue
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          PROFILE=$(jq -r '.profile' route-decision.json)
          TARGET=$(jq -r '.target' route-decision.json)
          LIGHT=$(jq -r '.lightweight' route-decision.json)
          BODY=$(jq -r '
            "## NADF Complexity Routing\n\n" +
            "- Profile: **\(.profile)**\n" +
            "- Target: **\(.target)**\n" +
            "- Lightweight: `\(.lightweight)`\n" +
            "- Branch: `\(.workBranch)`\n" +
            "- Domain ALLOWED: `" + ((.domainScope.allowed // []) | join(", ")) + "`\n" +
            "- Domain FORBIDDEN: `" + ((.domainScope.forbidden // []) | join(", ")) + "`\n" +
            "- Rationale: " + ((.rationale // []) | join("; ")) + "\n\n" +
            "Aislamiento: solo el alcance de este issue; no se tocan otras funcionalidades.\n" +
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ' route-decision.json)
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --repo arodriguez-novusintelligence/DoEventsWEB \
            --body "$BODY"

      - name: Build agent prompt
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        working-directory: nadf/prototypes/m6-cloud-agent
        run: |
          npm run build:doevents-prompt -- \
            "${{ github.workspace }}/route-decision.json" \
            "${{ github.workspace }}/issue.json" \
            "${{ github.workspace }}/agent-prompt.txt"

      - name: Invoke Cloud Agent(s)
        id: agent
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        working-directory: nadf/prototypes/m6-cloud-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NADF_PROMPT_FILE: ${{ github.workspace }}/agent-prompt.txt
          NADF_TARGET_REPOS: ${{ '' }} # filled below
          NADF_STARTING_REF: feature/NovusAIDevelopmentFramework
          NADF_MODEL: ${{ vars.NADF_MODEL || 'composer-2.5' }}
          NADF_AUTO_CREATE_PR: "true"
          NADF_AGENT_RESULT_FILE: ${{ github.workspace }}/agent-result.json
        shell: bash
        run: |
          REPOS=$(jq -r '.targetRepos | join(",")' "${{ github.workspace }}/route-decision.json")
          export NADF_TARGET_REPOS="$REPOS"
          echo "Repos=$NADF_TARGET_REPOS"
          npm run invoke:doevents-issue
          if [ -f "${{ github.workspace }}/agent-result.json" ]; then
            echo "agent_status=$(jq -r '.status' "${{ github.workspace }}/agent-result.json")" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify agent PRs (fail tipado si no hay push/PR)
        id: agent_verify
        if: ${{ always() && steps.issue.outputs.mode != 'deploy-only' && steps.agent.outcome != 'skipped' }}
        working-directory: nadf/prototypes/m6-cloud-agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          NADF_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          NADF_STARTING_REF: feature/NovusAIDevelopmentFramework
          NADF_AGENT_RESULT_FILE: ${{ github.workspace }}/agent-result.json
          NADF_AGENT_VERIFY_FILE: ${{ github.workspace }}/agent-verify.json
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${{ github.workspace }}/agent-result.json" ]; then
            echo '{"status":"FAIL","code":"AGENT_RUN_ERROR","why":"Falta agent-result.json tras Invoke","prOpened":false,"fixHint":"Revisar logs del Cloud Agent / CURSOR_API_KEY","details":[]}' \
              > "${{ github.workspace }}/agent-verify.json"
            echo "::error::AGENT_RUN_ERROR: falta agent-result.json"
            exit 2
          fi
          npm run verify:doevents-agent-prs -- "${{ github.workspace }}/route-decision.json"
          echo "code=$(jq -r '.code' "${{ github.workspace }}/agent-verify.json")" >> "$GITHUB_OUTPUT"
          echo "pr_opened=$(jq -r '.prOpened' "${{ github.workspace }}/agent-verify.json")" >> "$GITHUB_OUTPUT"

      - name: Validate domain scope (pre-merge)
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        working-directory: nadf/prototypes/m6-cloud-agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:doevents-scope -- "${{ github.workspace }}/route-decision.json" || {
            echo "::error::SCOPE_VIOLATION: el PR toca paths FORBIDDEN"
            exit 1
          }

          npm run validate:doevents-ui -- "${{ github.workspace }}/route-decision.json" || {
            echo "::error::UI_INVARIANT_BREAK: el PR rompe cableado/secciones Descubre"
            exit 1
          }

      - name: Auto-merge agent PRs → NADF branch (DEV only)
        id: merge
        if: ${{ steps.issue.outputs.mode != 'deploy-only' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          NADF_AUTO_MERGE_DEV: ${{ vars.NADF_AUTO_MERGE_DEV || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ steps.issue.outputs.number }}"
          BASE="feature/NovusAIDevelopmentFramework"
          MERGED_WEB=0
          MERGED_BACK=0
          SKIP_MERGE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_merge }}" = "true" ]; then
            SKIP_MERGE=true
          fi
          if [ "$SKIP_MERGE" = "true" ] || [ "${NADF_AUTO_MERGE_DEV}" != "true" ]; then
            echo "Auto-merge omitido (skip_merge o NADF_AUTO_MERGE_DEV!=true)"
            echo "merged_web=0" >> "$GITHUB_OUTPUT"
            echo "merged_back=0" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "auto_merge=true" >> "$GITHUB_OUTPUT"

          merge_issue_prs() {
            local REPO="$1"
            local -n COUNT_REF="$2"
            local COUNT=0
            local N
            local FOUND=0
            local FAILED=0
            while IFS= read -r N; do
              [ -z "${N:-}" ] && continue
              FOUND=$((FOUND + 1))
              echo "Merging $REPO#$N → $BASE (DEV only)"
              if gh pr ready "$N" --repo "$REPO" 2>/dev/null || true; then
                :
              fi
              if gh pr merge "$N" --repo "$REPO" --merge --delete-branch; then
                COUNT=$((COUNT + 1))
              else
                echo "::error::PR_MERGE_FAILED: no se pudo mergear $REPO#$N"
                FAILED=$((FAILED + 1))
              fi
            done < <(
              gh pr list --repo "$REPO" --state open --base "$BASE" --limit 30 \
                --json number,title,body \
                | jq -r --arg n "$ISSUE" '
                  .[]
                  | select(
                      (.title | test("#" + $n + "\\b"))
                      or (.body | test("(?i)(fixes|closes|resolves)\\s*#" + $n + "\\b"))
                      or (.body | test("#" + $n + "\\b"))
                    )
                  | .number
                '
            )
            COUNT_REF=$COUNT
            if [ "$FAILED" -gt 0 ]; then
              echo "merge_failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$FOUND" -gt 0 ] && [ "$COUNT" -eq 0 ]; then
              echo "::error::PR_MERGE_FAILED: había PR(s) del issue en $REPO pero ninguno se mergeó"
              echo "merge_failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          }

          TARGET=$(jq -r '.target' route-decision.json)
          if [ "$TARGET" = "web" ] || [ "$TARGET" = "both" ]; then
            merge_issue_prs "arodriguez-novusintelligence/DoEventsWEB" MERGED_WEB
          fi
          if [ "$TARGET" = "back" ] || [ "$TARGET" = "both" ]; then
            merge_issue_prs "arodriguez-novusintelligence/DoEventsBack" MERGED_BACK
          fi

          echo "merged_web=$MERGED_WEB" >> "$GITHUB_OUTPUT"
          echo "merged_back=$MERGED_BACK" >> "$GITHUB_OUTPUT"
          echo "Auto-merge DEV: WEB=$MERGED_WEB Back=$MERGED_BACK"

      - name: Build / validate WEB
        id: build
        if: ${{ hashFiles('route-decision.json') != '' }}
        working-directory: web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          TARGET=$(jq -r '.target' ../route-decision.json)
          if [ "$TARGET" = "web" ] || [ "$TARGET" = "both" ]; then
            git fetch origin feature/NovusAIDevelopmentFramework
            git checkout feature/NovusAIDevelopmentFramework
            git reset --hard origin/feature/NovusAIDevelopmentFramework
            npm ci
            npm run build:qa
            npm run lint --if-present
            npm run build:devaws
            # Postcondition: bundle DEV cloud debe embeber env=devaws (api-dev), no default "dev" (api-qa)
            if ! grep -Rql 'VITE_DOEVENTS_ENV:"devaws"' packages/shell/dist --include='*.js' --include='*.mjs' 2>/dev/null \
              && ! grep -Rql 'name:"devaws"' packages/shell/dist --include='*.js' --include='*.mjs' 2>/dev/null; then
              echo "::error::BUILD_ENV_MISMATCH: build:devaws no embebió VITE_DOEVENTS_ENV=devaws (riesgo api-qa)"
              exit 1
            fi
            if ! grep -Rql 'api-dev.doeventsapp.com' packages/shell/dist --include='*.js' --include='*.mjs' 2>/dev/null; then
              echo "::error::BUILD_ENV_MISMATCH: bundle sin api-dev.doeventsapp.com"
              exit 1
            fi
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip WEB build (target=$TARGET)"
            echo "ok=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug OIDC claims
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Requesting OIDC token..."
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub,aud,iss,repository,repository_owner,job_workflow_ref,ref}'

      - name: Assume AWS DEV (OIDC)
        id: aws
        if: >
          (vars.NADF_AUTO_DEPLOY_DEV != 'false') &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Fail if OIDC required but missing
        if: >
          always() &&
          (vars.NADF_AUTO_DEPLOY_DEV != 'false') &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true) &&
          steps.aws.outcome != 'success' &&
          steps.aws.outcome != 'skipped'
        shell: bash
        run: |
          echo "::error::DEPLOY_OIDC_FAILED: no se pudo assume-role AWS (vars.AWS_ROLE_ARN / trust OIDC)"
          exit 1

      - name: Deploy WEB DEV
        id: deploy
        if: >
          steps.aws.outcome == 'success' &&
          (vars.NADF_AUTO_DEPLOY_DEV != 'false') &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
        working-directory: web
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E1AIDTCT83PAW5' }}
          DOEVENTS_WEB_DEV_BUCKET: ${{ vars.DOEVENTS_WEB_DEV_BUCKET || 'doevents-web-dev' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          TARGET=$(jq -r '.target' ../route-decision.json)
          if [ "$TARGET" = "web" ] || [ "$TARGET" = "both" ]; then
            if [ -z "${VITE_GOOGLE_MAPS_API_KEY:-}" ]; then
              echo "::error::Falta vars.VITE_GOOGLE_MAPS_API_KEY (Actions → Variables). Vite la embebe en build."
              exit 1
            fi
            chmod +x infrastructure/aws/deploy-dev.sh
            ./infrastructure/aws/deploy-dev.sh
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip WEB deploy"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate Descubre wiring + marketplace smoke
        id: discover_gate
        if: always()
        working-directory: web
        shell: bash
        env:
          DISCOVER_SMOKE_API: ${{ vars.DISCOVER_SMOKE_API || 'https://api-dev.doeventsapp.com' }}
        run: |
          set -euo pipefail
          TARGET=$(jq -r '.target' ../route-decision.json 2>/dev/null || echo web)
          if [ "$TARGET" != "web" ] && [ "$TARGET" != "both" ]; then
            echo "Skip Descubre gate (target=$TARGET)"
            echo "pass=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f packages/shell/src/pages/EventsPage.tsx ]; then
            echo "::error::GATE_WIRING_FAILED: EventsPage.tsx ausente tras merge"
            exit 1
          fi
          if [ -f scripts/check-discover-wiring.mjs ]; then
            node scripts/check-discover-wiring.mjs || {
              echo "::error::GATE_WIRING_FAILED: check-discover-wiring"
              exit 1
            }
          else
            echo "::error::GATE_WIRING_FAILED: falta scripts/check-discover-wiring.mjs en la rama DEV"
            exit 1
          fi
          if [ -f scripts/smoke-discover-marketplace.mjs ]; then
            node scripts/smoke-discover-marketplace.mjs || {
              echo "::error::SMOKE_FAILED: smoke-discover-marketplace"
              exit 1
            }
          else
            echo "::error::SMOKE_FAILED: falta scripts/smoke-discover-marketplace.mjs en la rama DEV"
            exit 1
          fi
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Validate Back (checkout + deps)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          TARGET=$(jq -r '.target' route-decision.json)
          if [ "$TARGET" != "back" ] && [ "$TARGET" != "both" ]; then
            echo "Skip Back validate"; exit 0
          fi
          rm -rf back
          gh repo clone arodriguez-novusintelligence/DoEventsBack back \
            -- --branch feature/NovusAIDevelopmentFramework --single-branch --depth 1 || \
          gh repo clone arodriguez-novusintelligence/DoEventsBack back \
            -- --branch feature/DoEventsBack-Nadf --single-branch --depth 1
          for dir in aws-lambda-manageevents aws-lambda-login aws-lambda-managetickets aws-lambda-eventsFeed; do
            if [ -f "back/$dir/package.json" ]; then
              echo "==> $dir"
              npm ci --prefix "back/$dir" --omit=dev 2>/dev/null || npm install --prefix "back/$dir" --omit=dev
            fi
          done

      - name: Final issue comment + execution report
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          NADF_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          NADF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NADF_AGENT_RESULT_FILE: ${{ github.workspace }}/agent-result.json
          NADF_AGENT_VERIFY_FILE: ${{ github.workspace }}/agent-verify.json
          NADF_EXECUTION_REPORT_FILE: ${{ github.workspace }}/execution-report.json
          NADF_EXECUTION_COMMENT_FILE: ${{ github.workspace }}/execution-comment.md
        shell: bash
        run: |
          set -euo pipefail
          # Mapear outcomes de steps → taxonomía para consola / issue
          map_outcome() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              skipped|"") echo SKIP ;;
              *) echo WARN ;;
            esac
          }

          export NADF_STEP_AGENT=$(map_outcome "${{ steps.agent.outcome }}")
          export NADF_STEP_PR=$(map_outcome "${{ steps.agent_verify.outcome }}")
          if [ "${{ steps.merge.outputs.auto_merge || 'false' }}" = "true" ]; then
            export NADF_STEP_MERGE=$(map_outcome "${{ steps.merge.outcome }}")
            export NADF_STEP_MERGE_DETAIL="WEB=${{ steps.merge.outputs.merged_web || '0' }} Back=${{ steps.merge.outputs.merged_back || '0' }}"
            if [ "${{ steps.merge.outcome }}" = "failure" ]; then
              export NADF_STEP_MERGE_CODE=PR_MERGE_FAILED
            fi
          else
            export NADF_STEP_MERGE=SKIP
            export NADF_STEP_MERGE_DETAIL="auto_merge omitido"
          fi

          export NADF_STEP_BUILD=$(map_outcome "${{ steps.build.outcome }}")
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            export NADF_STEP_BUILD_CODE=BUILD_FAILED
          fi

          DEPLOYED="${{ steps.deploy.outputs.deployed || 'false' }}"
          AWS_OUT="${{ steps.aws.outcome || 'skipped' }}"
          if [ "$DEPLOYED" = "true" ]; then
            export NADF_STEP_DEPLOY=PASS
          elif [ "$AWS_OUT" = "failure" ]; then
            export NADF_STEP_DEPLOY=FAIL
            export NADF_STEP_DEPLOY_CODE=DEPLOY_OIDC_FAILED
            export NADF_STEP_DEPLOY_DETAIL="OIDC/assume-role falló"
          elif [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            export NADF_STEP_DEPLOY=FAIL
            export NADF_STEP_DEPLOY_CODE=DEPLOY_FAILED
          elif [ "${{ vars.NADF_AUTO_DEPLOY_DEV || 'true' }}" = "false" ] || [ "${{ inputs.skip_deploy || false }}" = "true" ]; then
            export NADF_STEP_DEPLOY=SKIP
            export NADF_STEP_DEPLOY_CODE=DEPLOY_SKIPPED
            export NADF_STEP_DEPLOY_DETAIL="auto_deploy desactivado o skip_deploy"
          else
            export NADF_STEP_DEPLOY=$(map_outcome "${{ steps.deploy.outcome }}")
            if [ "${NADF_STEP_DEPLOY}" = "SKIP" ]; then
              export NADF_STEP_DEPLOY_CODE=DEPLOY_SKIPPED
            fi
          fi

          DG="${{ steps.discover_gate.outputs.pass || 'n/a' }}"
          if [ "$DG" = "true" ]; then
            export NADF_STEP_GATES=PASS
          elif [ "$DG" = "skipped" ]; then
            export NADF_STEP_GATES=SKIP
          elif [ "${{ steps.discover_gate.outcome }}" = "failure" ]; then
            export NADF_STEP_GATES=FAIL
            export NADF_STEP_GATES_CODE=SMOKE_FAILED
          else
            export NADF_STEP_GATES=$(map_outcome "${{ steps.discover_gate.outcome }}")
          fi

          if [ -d nadf/prototypes/m6-cloud-agent ]; then
            (cd nadf/prototypes/m6-cloud-agent && npm run report:doevents-execution) || true
          else
            echo "## NADF ejecución \`${{ job.status }}\`" > execution-comment.md
            echo "" >> execution-comment.md
            echo "- Action: $NADF_RUN_URL" >> execution-comment.md
            echo "- (runtime NADF no disponible en este mode; comentario mínimo)" >> execution-comment.md
          fi

          # Imprimir resumen en consola Actions (visible sin abrir artifact)
          if [ -f execution-report.json ]; then
            echo "======== NADF EXECUTION REPORT ========"
            jq -r '"overall=" + .overall + " code=" + .primaryCode + "\nwhy=" + .why + "\nfix=" + .fixHint' execution-report.json
            echo "======================================="
          fi

          gh issue comment "${{ steps.issue.outputs.number }}" \
            --repo arodriguez-novusintelligence/DoEventsWEB \
            --body-file execution-comment.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nadf-doevents-issue-${{ steps.issue.outputs.number }}
          path: |
            issue.json
            route-decision.json
            agent-prompt.txt
            agent-result.json
            agent-verify.json
            execution-report.json
            execution-comment.md
          if-no-files-found: ignore
